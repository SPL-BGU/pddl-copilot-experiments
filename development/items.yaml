decisions:
  - id: DEC-20261108-01
    question: Change the contamination wording in the tex now?
    answer: >-
      Yes, as a small paper PR stacked on #121: the paired, clustered ±5 criterion; the
      test chosen after the sweep; the renaming lexical only; the unresolved per-task
      cells marked; the frontier solve comparison called unresolved.
    decided: 2026-11-08
    affects: [E8]
    logged: 2026-11-08
  - id: DEC-20261108-02
    question: Which experiments answer Corrêa et al. in the extension?
    answer: >-
      Approved for the extension prereg (plan D5): frontier thinking on (Sonnet and Haiku,
      plus other frontier vendors such as GPT and Gemini); larger problems (a size ladder
      from the IPC 2023 generators); the Claude tool arm on the renamed corpus.
    decided: 2026-11-08
    affects: [D5a, D5b, D5c, D1f]
    logged: 2026-11-08
  - id: DEC-20261109-01
    question: "D1b: where do the results live, and how are the new item kinds loaded?"
    answer: >-
      A new sweep folder; reused rerun rows copied in with `reused_from_folder`,
      `reused_from_job`, `reused_from_sha256`, `copied_at`
      (`tools/extension_copy_reused.py`); the prereg declares the reuse.
      `delivered-rerun/`, `sweep5v2-live`, `sweep6-live` never touched. Loader: two small
      validate_domain trees (`domains-hard-vd-a/`, `-vd-b/`), no harness change. Trees a
      and b must write to separate output folders (both name the invalid job
      `domain_neg`). No SLURM job id is stored in any results file, so the copy tool
      takes it as an argument (job ids are in `reference/delivered_rerun_prereg.md` §8).
    decided: 2026-11-09
    affects: [D1b, D1f]
    logged: 2026-11-09 — Repo audit
    note: >-
      Why: after the 35B flips, a rerun is not identical to the original, so reused rows
      must stay identifiable.
  - id: DEC-20261109-02
    question: "Llama 3.1 8B: which weights?"
    answer: Unsloth's ungated copy stays (weights byte-identical to Meta's).
    decided: 2026-11-09
    affects: [D2, D1f]
    logged: 2026-11-09 — Repo audit
    note: >-
      Omer's condition was "if its weight files match Meta's byte for byte". Checked
      2026-11-09: all four shards and the index match Meta's LFS pointers; only small
      config and tokenizer metadata differ, with the same chat template and stop tokens
      (`draft_release_licence_models.md` §2).
  - id: DEC-20261109-03
    question: "GPT-OSS: which reasoning effort?"
    answer: >-
      Effort low in wave 1, medium in wave 2, sent explicitly (`PDDL_REASONING_EFFORT`,
      `--reasoning-effort`); labelled "low effort", never "thinking off". gpt-oss puts the
      current date in its system message; pin it if runs must be reproducible.
    decided: 2026-11-09
    affects: [D1i, D2, D3, D1f]
    logged: 2026-11-09 — Repo audit
  - id: DEC-20261109-04
    question: "The 35B calling rate: which run is quoted?"
    answer: >-
      Quote both runs (68.0 and 82.7); "bigger calls less" is a direction only; the 35B
      cells go into the extension's repeat check (anchor slice, with a trial-level
      flip-rate endpoint).
    decided: 2026-11-09
    affects: [D1f, E2]
    logged: 2026-11-09 — Repo audit
  - id: DEC-20261109-05
    question: "Families: which go in which wave?"
    answer: >-
      Wave 1 = gpt-oss-20b and Llama 3.1 8B plus the official Gemma 4 BF16; Ministral 3
      14B = wave 2. Every family that passed the smoke is registered now as a numbered
      tier with the same analysis, so adding one later needs only a go-ahead. Later tiers
      (each must pass the parser smoke): GLM-4.7-Flash, gpt-oss-120b. Passed over:
      Nemotron 3 Nano, Granite 4.2 8B, Olmo 3 7B.
    decided: 2026-11-09
    affects: [D1f, D2, D3]
    logged: 2026-11-09 (evening)
    note: >-
      Omer: keep only the later-wave models of high value to the paper. GLM-4.7-Flash is
      a third family with a real thinking on/off switch, so the reasoning-mode finding
      (Gemma's calling falls from 21% to 0.6%) can be tested outside Qwen and Gemma; a
      new vendor and a fast MoE. gpt-oss-120b is the same family as the 20b at a larger
      size, so "bigger calls less" gets a test in a second family; a fast MoE that needs
      a GPU to itself. Passed over: Nemotron 3 Nano (a new architecture the paper's
      questions do not ask about; prefix caching unchecked), Granite 4.2 8B (dense and
      slow; Llama already fills the 8B rung), Olmo 3 7B (open training data would allow a
      direct contamination search, but that is a separate project; its thinking variant
      is a separate checkpoint, not a switch).
  - id: DEC-20261109-06
    question: "Gemma, wave 2 (thinking on): which reasoning parser?"
    answer: Keep `REASONING_PARSER=none`, as in Study 1. No parser side run.
