# items.yaml: the one place for the state of every open item and every decision.
#
# `python3 tools/tracking/items.py render` writes the live parts of STATUS.md from
# this file; `python3 tools/tracking/items.py check` fails on any contradiction it can
# test (add --offline to skip git and GitHub). Edit this file, never the rendered
# blocks in STATUS.md. Design: draft_tracking_proposal.md, Design A (Omer 2026-11-09,
# handoff_20261109.md decision 15).
#
# Schema, in short:
#   workstreams  letter -> name. An item's workstream is the first letter of its id.
#   lines        the study lines in STATUS "Where each line stands":
#                  id, name, state (one sentence), items (ids), evidence (paths)
#   items        id         plan step id (A1, D1b, D5a, ...); a new item takes the next
#                           free number or letter in its workstream; X-## until sorted.
#                           Ids are never reused; a dropped item stays, state dropped.
#                title      what the item is, in one line
#                state      todo | doing | blocked | review | done | dropped
#                owner      agent | omer
#                needs_omer none | decide | read | go-ahead | merge  (default none)
#                waits_on   item or decision ids that must be closed or answered first
#                branch, pr PR number or list of numbers; commit for a record-only step
#                evidence   repo paths (an "#anchor" suffix is allowed); [] only for todo
#                plan       where the step is described; issue: ISS-### link(s)
#                hold       why a blocked item waits on nothing in this file
#                was, note, updated
#   decisions    id DEC-YYYYMMDD-NN, question, answer (the recorded form of Omer's
#                words; empty while open), decided (date), affects (item ids),
#                logged (the paper_notes "## " heading it starts with), note
#
# Rules: done needs evidence and a PR (or a commit for a record-only step); review
# needs a PR or a branch; an answered decision needs its dated paper_notes entry.
# The agent marks an item done once its PR is merged. ISS-### entries stay in
# OPEN_ISSUES.md; items only link to them.

workstreams:
  A: Records
  B: Text that does not depend on new numbers
  C: Checks and analyses on data already on disk
  D: Experiments on the fixed setup
  E: The rewrite
  F: Before submission
  N: Advisor round
  X: Not yet sorted into a workstream

