    question: "D5a: which models and settings, and the full run?"
    answer: >-
      Sonnet 4.6 and Haiku 4.5 thinking on; Sonnet 5.5 thinking on and off
      (`between_tools`); thinking off at temperature 1 on the same problems; 3 repeats per
      problem. Full run approved (about $51 with the Batch API, range $33 to $72; the D5e
      cells add about $14 thinking on and $1.72 thinking off, so about $66 in all). Omer
      has $186 loaded plus a work account; when the loaded credits are used up, decide
      what comes next. It runs only after the D1f prereg holds the cells.
    decided: 2026-11-09
    affects: [D5a, D5e, D1f]
    logged: 2026-11-09 (late night) — D5a
    note: >-
      Cost method (moved here from STATUS): the D5e thinking-on cell (95 problems x 3 =
      285 trials) adds about $14 (about $10 to $19; 2-shot input from pilot arm e (7,626
      tokens per trial), output = arm a's mean Sonnet 4.6 thinking (4,123 tokens,
      bootstrap CI) plus arm e's mean answer (887), at Batch prices of $1.50 / $7.50 per
      MTok); its thinking-off cell adds $1.72 (95 x 1). PR #131 review.
